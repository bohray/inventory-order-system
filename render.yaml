# Render Blueprint: deploys the backend Docker image.
#
# The database is now an external Supabase Postgres (the Render free Postgres
# was removed). DATABASE_URL is NOT provisioned here — set it manually in the
# Render dashboard (service → Environment) so no connection string or password
# is ever committed. Paste Supabase's session-pooler URL verbatim; the backend
# normalizes it to "postgresql+psycopg://" at startup (see app/config.py).
# You also set CORS_ORIGINS to your Vercel frontend URL.

services:
  - type: web
    name: inventory-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # set manually in the dashboard (Supabase session-pooler URL)
      - key: CORS_ORIGINS
        sync: false # set to your Vercel frontend URL after deploying it
      - key: LOW_STOCK_THRESHOLD
        value: "10"
