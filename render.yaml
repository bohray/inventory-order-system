# Render Blueprint: provisions a free Postgres database and deploys the
# backend Docker image.
#
# DATABASE_URL is injected automatically from the database below. Render's
# connectionString uses the "postgresql://" scheme; the backend normalizes it
# to "postgresql+psycopg://" at startup (see app/config.py), so no manual edit
# is needed. You only have to set CORS_ORIGINS to your Vercel frontend URL.

databases:
  - name: inventory-db
    plan: free
    databaseName: inventory
    user: inventory

services:
  - type: web
    name: inventory-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # set to your Vercel frontend URL after deploying it
      - key: LOW_STOCK_THRESHOLD
        value: "10"
